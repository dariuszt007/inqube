<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inqube Calendar</title>

  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="topbar-row">
        <div>
          <h1>2026 Kalendarz</h1>
          <!--<p class="subtitle">Wydarzenia z ictcalendar + memo w inqube</p>-->
        </div>

        <div class="custom-controls">
          <button id="reloadBtn" class="btn ghost">Odśwież</button>
          <button id="copyAllMemoBtn" class="btn dark">Kopiuj cały memo.json</button>
          <button id="monthViewBtn" class="btn switch-btn active">Miesiąc</button>
          <button id="weekViewBtn" class="btn switch-btn">Tydzień</button>
        </div>
      </div>
    </header>

    <main class="main-wrap">
      <div id="status" class="status">Ładowanie wydarzeń...</div>
      <div id="copyStatus" class="status small hidden"></div>

      <section class="calendar-shell">
        <div id="calendar"></div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
